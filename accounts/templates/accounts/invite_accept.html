{% extends "base.html" %}
{% block title %}Урилга хүлээн авах{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title mb-1">Тавтай морил</h4>
                <p class="text-muted small">{{ invite.email }} · {{ invite.get_role_display }}</p>
                <form method="post">
                    {% csrf_token %}
                    {% include "partials/_form_fields.html" %}
                    <button class="btn btn-primary w-100">Нууц үг тавих</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
